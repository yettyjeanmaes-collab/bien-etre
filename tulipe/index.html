<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E23D5B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Tulipe — Bien-être à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF6F1; --card:#FFFFFF; --ink:#2A1F24; --muted:#857579; --line:#F3E3DD;
  --tulip:#E23D5B; --tulip2:#FF7A59; --tulip-soft:#FFE4E8; --leaf:#22A06B; --leaf-soft:#DDF5E9;
  --gold:#F5A524; --gold-soft:#FFF1D6; --blue:#2F8FD8; --blue-soft:#E1F0FC; --violet:#8E5BD8; --violet-soft:#EFE6FB;
  --r:20px; --shadow:0 6px 18px rgba(226,61,91,.08), 0 1px 3px rgba(42,31,36,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
:root{--glow1:#FFE0D6;--glow2:#FFE8EE;--hero1:#2A1F24;--hero2:#4A2A36}
html[data-theme="noel"]{--tulip:#B3122E;--tulip2:#D94436;--tulip-soft:#FBE3E3;--bg:#FFF9F3;--glow1:#FADADA;--glow2:#DDEFE3;--hero1:#0D3527;--hero2:#1C5B40;--gold:#C9962B;--gold-soft:#FBF0D6}
html[data-theme="hiver"]{--tulip:#3D6BD6;--tulip2:#7FA6F2;--tulip-soft:#E2EAFB;--bg:#F5F8FE;--glow1:#DCE7FB;--glow2:#ECE6FB;--hero1:#18213B;--hero2:#2D3C68}
html[data-theme="printemps"]{--tulip:#D9468C;--tulip2:#F28DB5;--tulip-soft:#FCE4EF;--bg:#FAFDF6;--glow1:#E4F6D8;--glow2:#FDE6F0;--hero1:#20402B;--hero2:#3B6E4A}
html[data-theme="ete"]{--tulip:#E8791C;--tulip2:#FFB938;--tulip-soft:#FFEBD6;--bg:#FFFBF2;--glow1:#FFF0C4;--glow2:#D8F3F5;--hero1:#0C4A57;--hero2:#15798A}
body{background:radial-gradient(1200px 500px at 100% -10%,var(--glow1) 0,transparent 60%),radial-gradient(900px 400px at -10% 30%,var(--glow2) 0,transparent 55%),var(--bg);background-attachment:fixed}
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.wrap{position:relative;z-index:1}
#deco i{position:absolute;top:-30px;font-style:normal;opacity:.75;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#deco i{animation:none;display:none}}
.seasonbadge{font-size:15px;margin-left:4px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 110px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--tulip) 0%,var(--tulip2) 100%);color:#fff;box-shadow:0 4px 16px rgba(226,61,91,.25)}
.top-in{max-width:720px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo .badge{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.logo h1{font-size:20px;white-space:nowrap;color:#fff}
.logo small{display:block;color:rgba(255,255,255,.85);font-size:12px;font-family:"Plus Jakarta Sans";font-weight:500}
.who{display:flex;background:rgba(255,255,255,.2);border-radius:999px;padding:3px}
.who button{border:0;background:none;padding:7px 13px;border-radius:999px;color:#fff;font-weight:600;font-size:13.5px}
.who button.on{background:#fff;color:var(--tulip);box-shadow:0 2px 6px rgba(0,0,0,.12)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:24px;box-shadow:0 8px 28px rgba(42,31,36,.16);padding:6px}
nav.tabs button{border:0;background:none;padding:7px 2px;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:18px;transition:all .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:#fff;background:linear-gradient(135deg,var(--tulip),var(--tulip2));box-shadow:0 4px 12px rgba(226,61,91,.35)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--tulip-soft);color:var(--tulip);font-family:"Plus Jakarta Sans";vertical-align:middle}
.pill.leaf{background:var(--leaf-soft);color:var(--leaf)}
.pill.gold{background:var(--gold-soft);color:#B56E00}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.secttl{display:flex;align-items:center;gap:8px;font-size:18px}
.secttl .em{font-size:22px}
/* bande des jours */
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;scroll-snap-type:x mandatory}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;scroll-snap-align:center;width:54px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);transition:transform .15s}
.strip button b{font-size:18px;color:var(--ink);font-family:Fraunces,serif}
.strip button span{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.strip button i{width:6px;height:6px;border-radius:50%;background:transparent;margin-top:2px}
.strip button i.done{background:var(--leaf)} .strip button i.part{background:var(--gold)}
.strip button.today{outline:2px dashed var(--tulip2);outline-offset:-2px}
.strip button.on{background:linear-gradient(160deg,var(--tulip),var(--tulip2));color:#fff;transform:translateY(-2px);box-shadow:0 8px 18px rgba(226,61,91,.35)}
.strip button.on b{color:#fff}
.strip button.on i.done,.strip button.on i.part{background:#fff}
/* héros */
.hero{background:linear-gradient(145deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,var(--tulip2),transparent 70%);opacity:.5}
.hero .day{font-size:13px;color:rgba(255,255,255,.75);font-weight:600}
.hero h2{font-size:26px;color:#fff}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;position:relative;z-index:1}
.ring{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:16px;padding:10px}
.ring svg{width:74px;height:74px;flex:none}
.ring .v{font-family:Fraunces,serif;font-size:24px;font-weight:700;line-height:1}
.ring .l{font-size:11.5px;color:rgba(255,255,255,.75);font-weight:600}
.ring .t{font-size:11px;color:rgba(255,255,255,.6)}
.cheer{margin-top:12px;background:rgba(255,255,255,.12);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:600;position:relative;z-index:1}
/* repas */
.mealc{background:#fff;border-radius:var(--r);margin:12px 0;box-shadow:var(--shadow);overflow:hidden;border-left:6px solid var(--c,var(--tulip))}
.mealc .hd{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}
.mealc .ico{width:44px;height:44px;border-radius:14px;background:var(--cs,var(--tulip-soft));display:grid;place-items:center;font-size:24px;flex:none}
.mealc h3{font-size:17px}
.mealc .k{font-size:12.5px;color:var(--muted);font-weight:600}
.mealc .k b{color:var(--c);font-weight:800}
.mealc .bd{padding:0 14px 14px 70px}
.mealc.eaten{background:linear-gradient(0deg,#F4FBF7,#fff)}
.eatbtn{margin-left:auto;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;flex:none;transition:all .2s}
.eatbtn svg{width:16px;height:16px}
.eatbtn.on{background:var(--leaf);border-color:var(--leaf);color:#fff;box-shadow:0 4px 12px rgba(34,160,107,.35)}
.eatbtn:active{transform:scale(.94)}
.dish{margin:8px 0 0}
.dish b{font-weight:700;font-size:14.5px}
.ing{font-size:13px;color:var(--muted)}
.prep{font-size:13px;margin-top:5px;background:#FFF8F3;border-radius:12px;padding:8px 10px;border:1px dashed #F6D9CC}
.toggle{display:inline-flex;background:#F7EDE9;border-radius:999px;padding:3px;gap:2px}
.toggle button{border:0;background:none;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted);border-radius:999px}
.toggle button.on{background:#fff;color:var(--c,var(--tulip));box-shadow:0 2px 6px rgba(0,0,0,.1)}
.btn{border:0;background:linear-gradient(135deg,var(--tulip),var(--tulip2));color:#fff;border-radius:14px;padding:11px 16px;font-weight:700;box-shadow:0 4px 12px rgba(226,61,91,.3)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.small{padding:7px 12px;font-size:13px;border-radius:12px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 11px;background:#FFFCFA;font-size:15px;width:100%;font-weight:500;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--tulip2);background:#fff}
.glasses{display:flex;gap:4px;justify-content:space-between}
.glasses button{width:36px;height:46px;border:0;background:none;padding:0;transition:transform .15s}
.glasses button:active{transform:scale(.85)}
.glasses svg{width:100%;height:100%}
.moods{display:flex;gap:6px}
.moods button{flex:1;border:0;background:#F8F0EC;border-radius:14px;padding:7px 0;font-size:22px;filter:grayscale(1);opacity:.55;transition:all .15s}
.moods button.on{filter:none;opacity:1;background:var(--gold-soft);transform:scale(1.08);box-shadow:0 3px 8px rgba(245,165,36,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:#F7EDE9;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chips button.on{background:linear-gradient(135deg,var(--tulip),var(--tulip2));color:#fff}
.shop h3{font-size:14px;margin:16px 0 6px;font-family:"Plus Jakarta Sans";font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.shop h3 .em{font-size:20px}
.shop h3 .cnt{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:700}
.shop label{display:flex;gap:10px;align-items:center;padding:10px 12px;margin:5px 0;border-radius:14px;background:#FFFAF7;font-size:14.5px;font-weight:500;transition:all .2s}
.shop label input{width:22px;height:22px;accent-color:var(--leaf);flex:none}
.shop label.done{background:#F1FAF5}
.shop label.done span{text-decoration:line-through;color:var(--muted)}
.shop .q{margin-left:auto;font-weight:800;white-space:nowrap;padding-left:8px;color:var(--tulip)}
.shop label.done .q{color:var(--muted)}
.progress-shop{height:10px;background:#F7EDE9;border-radius:999px;overflow:hidden;margin-top:8px}
.progress-shop i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#5BD39B);border-radius:999px;transition:width .3s}
.tip{background:linear-gradient(135deg,#FFF1D6,#FFE4E8)}
.tip h3{font-size:15px;color:#9A4A12}
.ecart{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.ecart:last-child{border-bottom:0}
.x{border:0;background:#F7EDE9;color:var(--muted);font-size:16px;width:28px;height:28px;border-radius:50%;line-height:1}
.status{font-size:12px;color:var(--muted);text-align:center;margin:10px 0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.dayrow{display:flex;align-items:center;gap:12px}
.dayrow .n{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--tulip),var(--tulip2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:17px}
details[open] .chev{transform:rotate(90deg)}
.chev{transition:transform .2s;color:var(--tulip);font-size:20px}
.twocol{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:13px}
.twocol .h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.twocol .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.sheet{position:fixed;inset:0;background:rgba(42,31,36,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .in{background:var(--bg);width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:20px 16px 30px;max-height:88vh;overflow:auto;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}} @keyframes fade{from{opacity:0}}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.warn{background:var(--tulip-soft);color:#A3203A;border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:10px;font-weight:600}
.okbox{background:var(--leaf-soft);color:#17704A;border-radius:14px;padding:11px 13px;font-size:13.5px;margin-top:10px;font-weight:500}
.stat{border-radius:16px;padding:12px;background:var(--cs);}
.stat .tiny{font-weight:700;color:var(--c)}
.big{font-family:Fraunces,serif;font-size:28px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drinkbtn{border:0;border-radius:16px;background:var(--cs);color:var(--c);padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .12s}
.drinkbtn:active{transform:scale(.93)}
.drinkbtn .e{font-size:26px}
.drinkbtn b{font-size:12.5px}
.drinkbtn .tiny{color:var(--muted);font-weight:600}
.tl{margin-top:10px;position:relative}
.tli{display:flex;align-items:center;gap:10px;padding:7px 0;position:relative}
.tlh{border:0;background:#F7EDE9;border-radius:10px;padding:5px 8px;font-weight:800;font-size:13px;color:var(--ink);min-width:62px;font-variant-numeric:tabular-nums}
.tld{width:10px;height:10px;border-radius:50%;background:var(--tulip2);box-shadow:0 0 0 3px var(--tulip-soft);flex:none}
.tle{font-size:20px}
.aicard{background:linear-gradient(160deg,#FFFFFF 0%,#FFF3EE 100%);border:1.5px solid #FFD9CC}
.aibox textarea{width:100%;border:1.5px solid #FFD0C2;border-radius:16px;padding:11px 12px;background:#fff;font-size:15px;resize:vertical;margin-top:10px}
.aibox textarea:focus{outline:none;border-color:var(--tulip2)}
.micbtn{width:52px;height:46px;border:0;border-radius:14px;background:var(--tulip-soft);font-size:22px;flex:none}
.micbtn.on{background:var(--tulip);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,61,91,.5)}70%{box-shadow:0 0 0 12px rgba(226,61,91,0)}100%{box-shadow:0 0 0 0 rgba(226,61,91,0)}}
.bub{border-radius:18px;padding:10px 13px;margin-top:10px;font-size:14px;max-width:92%;position:relative}
.bub.me{background:linear-gradient(135deg,var(--tulip),var(--tulip2));color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.bub.me .hr{display:block;font-size:11px;opacity:.8;margin-top:3px;text-align:right}
.bub.cl{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.thinking{color:var(--muted);font-weight:600}
.dots i{animation:blink 1.2s infinite;font-style:normal}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.btn[disabled]{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:4px;border:0;background:#F7EDE9;color:var(--ink);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
.dacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:flex-start}
.dacts details{width:auto}.dacts details[open]{width:100%}
.repl{font-size:13px;font-weight:700;color:var(--leaf);margin-top:2px}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0 0 0 4px}
.notebtn{margin-top:12px;width:100%;border:1.5px dashed #F2C9BB;background:#FFF8F4;border-radius:14px;padding:9px;font-weight:700;font-size:13px;color:var(--tulip)}
.iconbtn{border:0;background:var(--tulip-soft);border-radius:10px;width:32px;height:32px;font-size:15px;flex:none}
.iconbtn[disabled]{opacity:.3}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:16px;padding:11px 13px;margin-top:8px}
.opt span{font-size:12.5px;color:var(--muted)}
.opt.on{border-color:var(--leaf);background:var(--leaf-soft)}
.bilan{background:linear-gradient(150deg,#3B2550 0%,#6A3B6E 60%,#C2577A 100%);color:#fff}
.bajust{margin-top:10px;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;font-size:14px}
.rayrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.rayrow span{flex:1}
.j10{background:linear-gradient(160deg,#fff 0%,#F2FBF6 100%)}
.cmp{display:grid;grid-template-columns:1.4fr 1fr 18px 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cmp.head{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;border:0;padding-bottom:0;margin-top:8px}
.cmp .arr{color:var(--leaf);font-weight:800}
.grid3{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.mini{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mini b{display:block;font-family:Fraunces,serif;font-size:20px;color:var(--leaf)}
.mini span{font-size:12px;color:var(--muted);font-weight:600}
.chips button.on{background:linear-gradient(135deg,var(--tulip),var(--tulip2));color:#fff}
.rit{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:14px;font-weight:600;border-bottom:1px solid var(--line)}
.rit:last-child{border:0}.rit input{width:20px;height:20px;accent-color:var(--leaf)}
.tblwrap{overflow-x:auto;margin-top:10px;border-radius:14px;border:1px solid var(--line)}
table.mes{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
table.mes th{background:#FFF3EE;text-align:right;padding:8px 10px;font-weight:800;font-size:12px;color:var(--ink)}
table.mes th small{display:block;font-weight:600;color:var(--muted);font-size:10.5px}
table.mes th:first-child,table.mes td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:700}
table.mes th:first-child{background:#FFF3EE}
table.mes td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;cursor:pointer}
table.mes tfoot td{font-weight:800;background:#FAFAF8}
table.mes tfoot td:first-child{background:#FAFAF8}
table.mes td.dn{color:var(--leaf)} table.mes td.up{color:var(--tulip)}
.librebox{margin-top:8px;background:linear-gradient(135deg,var(--gold-soft),var(--tulip-soft));border-radius:14px;padding:11px 13px;font-size:14px}
.librebox .tiny{display:block;margin-top:4px;color:var(--muted);font-weight:700}
.alertc{background:linear-gradient(135deg,#FFF1D6,#FFE4E8);border-left:6px solid var(--gold)}

// ---------- écritures (une à la fois par document)
const pending = {}, inflight = {};
function persist(path, data){
  saveLocal();
  if(!DB) return;
  pending[path] = data;
  if(inflight[path]) return;
  flush(path);
}
async function flush(path){
  while(pending[path]){
    const d = pending[path]; delete pending[path];
    inflight[path] = true;
    try{ await DB.doc(path).set(JSON.parse(JSON.stringify(d))); }
    catch(e){
      if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{await DB.doc(path).set(d)}catch(e2){setStatus("Enregistrement impossible pour le moment")} }
      else if(e && e.code==="invalid_argument"){ setStatus("Lecture seule : demandez un accès « Éditeur » pour enregistrer"); }
      else setStatus("Enregistrement impossible pour le moment");
    }
    inflight[path] = false;
  }
}
function setStatus(m){ statusMsg=m; const el=document.getElementById("status"); if(el) el.textContent=m; }

async function initDB(){
  let db=null;
  try{ db = await window.claude.use("db"); }catch(e){ db=null; }
  if(!db){ setStatus("Mode local : les données restent sur cet appareil"); return; }
  DB = db;
  let got=false; const timer=setTimeout(()=>{ if(!got) setStatus("Connexion lente… les données s'afficheront dès que possible"); },10000);
  const ok=()=>{ if(!got){got=true;clearTimeout(timer);} online=true; setStatus("Synchronisé — partagé entre vos appareils"); };
  const err=()=>{ clearTimeout(timer); setStatus("Synchronisation indisponible — mode local"); };
  DB.doc("app/reglages").onSnapshot(s=>{ if(s.exists){ S.reglages = deepMerge(JSON.parse(JSON.stringify(DEFAULTS)), s.data()); saveLocal(); render(); } if(!s.metadata.fromCache) ok(); }, err);
  DB.collection("journal").onSnapshot(q=>{ const j={}; q.docs.forEach(d=>j[d.id]=d.data()); S.journal=j; saveLocal(); render(); if(!q.metadata.fromCache) ok(); }, err);
  DB.collection("poids").onSnapshot(q=>{ const p={}; q.docs.forEach(d=>p[d.id]=d.data()); S.poids=p; saveLocal(); render(); }, err);
  DB.collection("bilans").onSnapshot(q=>{ const b={}; q.docs.forEach(d=>b[d.id]=d.data()); S.bilans=b; render(); }, err);
  DB.doc("app/choix").onSnapshot(s=>{ S.choix = s.exists ? (s.data().choix||{}) : {}; saveLocal(); render(); }, err);
  DB.doc("app/sport").onSnapshot(s=>{ S.sport = s.exists ? s.data() : null; render(); }, ()=>{});
  DB.doc("app/courses").onSnapshot(s=>{ S.coches = s.exists ? (s.data().coches||{}) : {}; saveLocal(); render(); }, err);
}

function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function diffDays(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
const JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"], MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmt(s){ const d=parse(s); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }

// ---------- nutrition
function nutr(items, coef){
  let k=0,p=0,c=0,f=0;
  for(const [key,g] of items){ const n=ING[key]; const gg=g*(coef?coef[n.cat]||1:1); k+=n.k*gg/100; p+=n.p*gg/100; c+=n.c*gg/100; f+=n.f*gg/100; }
  return {k,p,c,f};
}
function hasAlt(meal){ return meal[1].some(d=>d[3]); }
function sansPoisson(di,key){ return !!S.choix[di+"-"+key]; }
function mealView(di,key,meal){ if(!hasAlt(meal)||!sansPoisson(di,key)) return meal; return [meal[0], meal[1].map(d=>d[3]?d[3]:d)]; }
function altToggle(di,key){ const on=sansPoisson(di,key); return `<div class="toggle" style="margin-top:5px"><button data-act="alt" data-i="${di}" data-k="${key}" data-v="0" class="${on?"":"on"}">Poisson</button><button data-act="alt" data-i="${di}" data-k="${key}" data-v="1" class="${on?"on":""}">Sans poisson</button></div>`; }
const SUBS_SKYR=[["skyr","Skyr (par défaut)"],["fromage_blanc","Fromage blanc 0 %"],["yaourt_grec","Yaourt grec 0 %"],["yaourt_prot","Yaourt protéiné nature"],["cottage","Cottage cheese (salé ou sucré)"]];
function subItems(items){ const s=(S.reglages.subs||{}).skyr; if(!s||s==="skyr") return items; const f=ING.skyr.p/ING[s].p; return items.map(([k,g])=>k==="skyr"?[s,Math.round(g*f/5)*5]:[k,g]); }
function mealItems(meal){ return meal[1].flatMap(d=>subItems(d[1])); }
function coefFor(who){ return who==="lui" ? S.reglages.lui.coef : null; }
// Jour de sport de Monsieur : choix manuel d'abord, sinon séance Garmin réelle, sinon jours habituels
function pdLuiOf(date,j){
  if(j && j.pdLui!==undefined) return !!j.pdLui;
  const sp=S.sport; if(!sp) return false;
  if(sp.jours && sp.jours[date]) return true;
  if(sp.synchro && date<=sp.synchro) return false;
  return (sp.habituels||[]).includes(parse(date).getDay());
}
function jKey(date,who){ return date+"-"+who; }
function J(date,who){ return S.journal[jKey(date,who)] || {}; }
function setJ(date,who,patch){
  const id=jKey(date,who); const cur=Object.assign({},S.journal[id]||{},patch,{date,who});
  S.journal[id]=cur; cur.tot=dayTotals(date,who); persist("journal/"+id,cur); render();
}
// repas du jour pour une personne : [{key, label, meal, coef}]
function mealsOf(dayIdx, who, date){
  const D = dayAt(dayIdx,who); const j=J(date,who); const out=[];
  if(who==="elle"){
    const choix = j.pdChoix||"pd_sucre";
    out.push({key:"pd", meal:D[choix], choix});
  } else if(pdLuiOf(date,j)){
    out.push({key:"pd", meal:D.proto==="dm"?LUI_PD_DM:LUI_PD, raw:true});
  }
  let dej=mealView(dayIdx,"dej",D.dej);
  if(who==="lui"&&!["reint","aplv"].includes(D.proto)&&pdLuiOf(date,j)) dej=[dej[0], dej[1].concat([LUI_FEC_DM])];
  const order = D.proto==="dm"?["collation","dej","gouter","diner"]:D.proto==="reint"?["dej","gouter","diner","collation"]:["gmatin","dej","gouter","diner","collation"];
  const LIB=["bg","sd","aplv"].includes(D.proto);
  order.forEach(k=>{
    if(k==="dej") out.push({key:"dej", meal:dej, alt:hasAlt(D.dej), libre:LIB&&isLibre(dayIdx,who,"dej",date), canLibre:LIB});
    else if(k==="diner") out.push({key:"diner", meal:mealView(dayIdx,"diner",D.diner), alt:hasAlt(D.diner), libre:LIB&&isLibre(dayIdx,who,"diner",date), canLibre:LIB});
    else if(D[k]) out.push({key:k, meal:D[k], opt:true});
  });
  return out;
}
function r0(x){return Math.round(x)}
function glyco(items){
  let c=0,p=0,f=0,leg=0,sucre=0; for(const [k,g] of items){ const n=ING[k]; if(!n) continue; c+=n.c*g/100; p+=n.p*g/100; f+=n.f*g/100; if(n.cat==="leg") leg+=g; if(["fruit"].includes(n.cat)||["miel","sirop_erable","banane"].includes(k)) sucre+=n.c*g/100; }
  if(c<15) return {lv:"ok",t:"Glycémie stable"};
  if(p<7&&f<5) return {lv:"warn",t:"Pic possible",tip:"Sucres sans protéine : ajoutez un skyr, un œuf ou une poignée d'amandes, ou prenez-le en fin de repas."};
  if(p>=15&&(leg>=80||f>=8||sucre<c*0.5)) return {lv:"ok",t:"Glycémie stable"};
  if(c<25&&(p+f)>=8) return {lv:"ok",t:"Glycémie stable"};
  return {lv:"mid",t:"À équilibrer",tip:"Mangez d'abord les légumes et la protéine, le féculent ou le fruit en dernier."};
}
function glycoPill(m){ if(m.libre) return ""; const g=glyco(mealItems(m.meal)); return `<span class="gly ${g.lv}" title="${esc(g.tip||"")}">🩸 ${g.t}</span>`; }
function mN(m,coef){ return m.libre?{k:0,p:0,c:0,f:0}:nutr(mealItems(m.meal),m.raw?null:coef); }

function saison(d){ const m=d.getMonth()+1, j=d.getDate(), md=m*100+j;

function chart(pts,goal,key,unit){ key=key||"poids"; unit=unit||"kg"; pts=pts.map(p=>Object.assign({},p,{poids:+p[key]}));
  const W=340,H=170,pl=34,pr=10,pt=10,pb=24;
  const ys=pts.map(p=>+p.poids).concat(goal?[goal]:[]); let mn=Math.floor(Math.min(...ys)-1), mx=Math.ceil(Math.max(...ys)+1);
  const t0=parse(pts[0].date), t1=parse(pts[pts.length-1].date); const span=Math.max(1,(t1-t0));
  const X=d=>pl+(parse(d)-t0)/span*(W-pl-pr), Y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de poids">`;
  const step=Math.max(1,Math.round((mx-mn)/4));
  for(let v=mn;v<=mx;v+=step) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EDE4DF"/><text x="${pl-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="#7A6F6A">${v}</text>`;
  if(goal) s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="#22A06B" stroke-dasharray="4 4"/><text x="${W-pr}" y="${Y(goal)-4}" font-size="10" text-anchor="end" fill="#22A06B">objectif ${goal} ${unit}</text>`;
  s+=`<polyline fill="none" stroke="#E23D5B" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p.date)+","+Y(p.poids)).join(" ")}"/>`;
  pts.forEach(p=>s+=`<circle cx="${X(p.date)}" cy="${Y(p.poids)}" r="3.5" fill="#fff" stroke="#E23D5B" stroke-width="2"/>`);
  s+=`<text x="${pl}" y="${H-6}" font-size="10" fill="#7A6F6A">${fmt(pts[0].date).split(" ").slice(1).join(" ")}</text><text x="${W-pr}" y="${H-6}" font-size="10" text-anchor="end" fill="#7A6F6A">${fmt(pts[pts.length-1].date).split(" ").slice(1).join(" ")}</text>`;
  return s+"</svg>";
}

  else if(a==="addecart"){ ecartSheet(); }
  else if(a==="preset"){ document.getElementById("ecT").value=b.dataset.t; document.getElementById("ecK").value=b.dataset.k; document.getElementById("ecP").value=b.dataset.p; }
  else if(a==="saveecart"){ const t=document.getElementById("ecT").value.trim(); if(!t) return; const e={t,k:+document.getElementById("ecK").value||0,p:+document.getElementById("ecP").value||0}; closeSheet(); setJ(date,who,{ecarts:(j.ecarts||[]).concat([e])}); }
  else if(a==="delecart"){ const L=(j.ecarts||[]).slice(); L.splice(+b.dataset.i,1); setJ(date,who,{ecarts:L}); }
  else if(a==="shopday"){ const i=+b.dataset.i; const L=shopDays(); S.shopDays = L.includes(i)? L.filter(x=>x!==i) : L.concat([i]).sort((x,y)=>x-y); render(); }
  else if(a==="shopg"){ S.shopGouter=b.dataset.v==="1"; render(); }
  else if(a==="resetshop"){ S.coches={}; persist("app/courses",{coches:{}}); render(); }
  else if(a==="copyshop"){ const t=shopText(); navigator.clipboard.writeText(t).then(()=>{b.textContent="Copiée ✓"},()=>{openSheet(`<h2 style="font-size:18px">Liste à copier</h2><textarea style="width:100%;height:50vh;margin-top:10px">${esc(t)}</textarea><button class="btn ghost" style="margin-top:10px" data-act="closesheet">Fermer</button>`)}); }
  else if(a==="addana"){ anaSheet(who,today()); }
  else if(a==="editana"){ anaSheet(who,b.dataset.d); }
  else if(a==="saveana"){ const d=document.getElementById("aDate").value||today(); const e={date:d,who}; let any=false; ANALYSES.forEach(([k])=>{ const v=parseFloat(String(document.getElementById("a_"+k).value).replace(",",".")); if(v>0){e[k]=v;any=true;} }); if(!any) return; S.analyses=Object.assign({},S.analyses,{[d+"-"+who]:e}); if(DB&&PRIV) DB.doc(PRIV+"/ana-"+d+"-"+who).set(e).catch(()=>toast("Enregistrement impossible")); else saveLocal(); closeSheet(); toast("Résultats enregistrés 🩸"); render(); }
  else if(a==="addmes"){ mesureSheet(who,today()); }
  else if(a==="editmes"){ mesureSheet(who,b.dataset.d); }
  else if(a==="chartm"){ S.chartM=b.dataset.k; render(); }
  else if(a==="savemes"){ const d=document.getElementById("mDate").value||today(); const e={date:d,who}; let any=false; MESURES.forEach(([k])=>{ const v=parseFloat(String(document.getElementById("m_"+k).value).replace(",",".")); if(v>0){ e[k]=v; any=true; } }); if(!any) return; const orig=b.dataset.orig, id=d+"-"+who; if(orig&&orig!==id){ delete S.poids[orig]; if(DB) DB.doc("poids/"+orig).delete().catch(()=>{}); } S.poids[id]=e; persist("poids/"+id,e); closeSheet(); toast("Mesures enregistrées 📏"); render(); }
  else if(a==="addpoids"){ const p=parseFloat(String(document.getElementById("inPoids").value).replace(",",".")); const t=parseFloat(String(document.getElementById("inTaille").value).replace(",",".")); if(!p) return; const d=today(); const id=d+"-"+who; const e={date:d,who,poids:p}; if(t) e.taille=t; S.poids[id]=e; persist("poids/"+id,e); render(); }
  else if(a==="delpoids"){ const id=b.dataset.id; delete S.poids[id]; saveLocal(); if(DB) DB.doc("poids/"+id).delete().catch(()=>{}); closeSheet(); render(); }
  else if(a==="autolui"){ const L=S.reglages.lui; const p=+L.poids; if(!p){ openSheet(`<p>Renseignez d'abord le poids de ${esc(L.nom)}.</p><button class="btn ghost" data-act="closesheet">OK</button>`); return; } L.pmin=Math.round(p*1.6); L.pmax=Math.round(p*2); saveReglages(); render(); }
});
document.addEventListener("change",async ev=>{ const el=ev.target; if(!el.dataset||!el.dataset.photo||!el.files||!el.files[0]) return;
  if(!DB||!PRIV){ toast("Photos disponibles dans l'application publiée"); return; }
  try{ const f=el.files[0]; const bmp=await createImageBitmap(f); const sc=Math.min(1,720/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    let q=0.72, url=c.toDataURL("image/jpeg",q); while(url.length>240000&&q>0.3){ q-=0.1; url=c.toDataURL("image/jpeg",q); }
    const d=today(), id="ph-"+d+"-"+S.who+"-"+Date.now().toString(36); const e={date:d,who:S.who,img:url}; await DB.doc(PRIV+"/"+id).set(e); toast("Photo enregistrée 📸"); }
  catch(e){ toast("Photo impossible à enregistrer"); } });
document.addEventListener("input",ev=>{ if(ev.target.id==="aiIn"||ev.target.id==="aiIn2") S.aiDraft=ev.target.value; });
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.dataset.act==="coche"){ S.coches=Object.assign({},S.coches,{[el.dataset.k]:el.checked}); persist("app/courses",{coches:S.coches}); render(); return; }
  if(el.dataset.vict!==undefined){ const di=currentDayIdx(), d=dateForDay(di); const V=(J(d,S.who).victoires||["","",""]).slice(); V[+el.dataset.vict]=el.value; setJ(d,S.who,{victoires:V}); return; }
  if(el.dataset.field){ const di=currentDayIdx(); let v=el.value; if(el.type==="number") v=v===""?"":+v; setJ(dateForDay(di),S.who,{[el.dataset.field]:v}); return; }
  if(el.dataset.prof){ const [w,k]=el.dataset.prof.split("."); let v=el.value; if(el.type==="number") v=v===""?"":+v; S.reglages[w][k]=v; saveReglages(); render(); return; }
  if(el.dataset.prof2){ S.reglages[el.dataset.prof2]=el.value; saveReglages(); render(); return; }
  if(el.dataset.coef){ S.reglages.lui.coef[el.dataset.coef]=+el.value; saveReglages(); render(); return; }
  if(el.dataset.set==="start"){ if(el.value){ S.reglages.start=el.value; S.day=null; S.shopDays=null; saveReglages(); render(); } }
});
document.addEventListener("toggle",ev=>{ const d=ev.target; if(d.dataset&&d.dataset.day!==undefined && d.open) S.openDay=+d.dataset.day; },true);

render();
initDB();
initAI();
setTimeout(()=>{ (async()=>{ for(let k=0;k<20&&!DB;k++) await new Promise(r=>setTimeout(r,500)); initPrivate(); })(); },0);
</script>
